# Llama Studio na nuvem atrás do nginx. Copie para /etc/nginx/sites-available/studio, troque o domínio e os
# certificados, ative (ln -s ... sites-enabled/) e rode: sudo nginx -t && sudo systemctl reload nginx
# O hub escuta em 127.0.0.1:8700 (docker-compose.yml).

map $http_upgrade $studio_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name studio.seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/studio.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.seudominio.com/privkey.pem;

    # anexos e arquivos enviados pela interface
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;

        # túnel do PC (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studio_upgrade;

        proxy_set_header Host $host;
        # só o IP real (sem repassar o que o cliente mandou: o hub usa isso no limite de cadastros e logins)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # streaming do chat sem buffer e tarefas longas sem corte
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

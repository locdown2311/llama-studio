[package]
name = "studio-hub"
version = "0.1.0"
edition = "2021"
description = "Central da versão nuvem do Llama Studio: contas, PC vinculado e um studio por usuário em contêiner"

# pacote à parte (não entra no build do studio para Windows)
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "time", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

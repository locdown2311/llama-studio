<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administração · Llama Studio</title>
<link rel="icon" href="/hub/icon.svg">
<meta name="theme-color" content="#17181c">
<style>
:root { --bg:#f6f6f8; --card:#fff; --text:#1d1e22; --muted:#6b6e78; --line:#e3e4e8; --accent:#5b5bd6; --ok:#2f9e58; --err:#c0392b; --warn:#b7791f; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181c; --card:#1f2025; --text:#e9e9ee; --muted:#9a9ca6; --line:#2e3037; --accent:#8b8bf0; --ok:#5cc483; --err:#ff7b6b; --warn:#e0b04d; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); }
header { display:flex; align-items:center; gap:10px; max-width:1100px; margin:0 auto 16px; }
header img { width:28px; height:28px; }
h1 { font-size:19px; margin:0; flex:1; }
a.back { color:var(--accent); text-decoration:none; font-size:14px; }
main { max-width:1100px; margin:0 auto; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.stat b { display:block; font-size:22px; font-weight:650; }
.stat span { color:var(--muted); font-size:12.5px; }
.bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.bar input { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--text); font:inherit; }
.list { display:grid; gap:10px; }
.u { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.u.off { opacity:.6; }
.top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.top .em { font-weight:600; word-break:break-all; flex:1; min-width:180px; }
.tag { font-size:11.5px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.tag.on { color:var(--ok); border-color:currentColor; }
.tag.bad { color:var(--err); border-color:currentColor; }
.tag.adm { color:var(--accent); border-color:currentColor; }
.meta { color:var(--muted); font-size:12.5px; margin:6px 0 8px; display:flex; gap:14px; flex-wrap:wrap; }
.disk { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:2px 0 10px; }
.disk i { display:block; height:100%; background:var(--accent); }
.disk i.full { background:var(--err); }
.acts { display:flex; gap:6px; flex-wrap:wrap; }
button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:7px 11px; font:inherit; font-size:13px; cursor:pointer; min-height:36px; }
button:hover { border-color:var(--accent); }
button.danger { color:var(--err); }
.err { color:var(--err); margin:10px 0; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#222; color:#fff; padding:8px 14px; border-radius:9px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on { opacity:1; }
.cfg { color:var(--muted); font-size:12.5px; margin:-6px 0 14px; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:18px; width:min(460px, calc(100vw - 32px)); }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog h2 { font-size:16px; margin:0 0 12px; }
dialog label { display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px; }
dialog input, dialog select { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); font:inherit; }
dialog .sec { margin-top:14px; padding-top:10px; border-top:1px solid var(--line); font-weight:600; font-size:13px; }
dialog .hint { font-size:12px; color:var(--muted); margin-top:4px; }
dialog .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.newpass { background:var(--bg); border:1px dashed var(--accent); border-radius:9px; padding:10px; margin-top:10px; font-family:ui-monospace, monospace; word-break:break-all; }
</style>
</head>
<body>
<header><img src="/hub/icon.svg" alt=""><h1 id="title"></h1><a class="back" href="/" id="back"></a></header>
<main>
  <div class="stats" id="stats"></div>
  <div class="cfg" id="cfg"></div>
  <div class="bar"><input id="q" type="search" autocomplete="off"><button id="new" class="primary"></button><button id="reload"></button><button id="pull"></button></div>
  <div class="err" id="err" role="alert"></div>
  <div class="list" id="list"></div>
</main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm">
  <h2 id="dlgTitle"></h2>
  <div id="dlgAcct">
    <label id="lEmail"></label><input id="fEmail" type="email" autocomplete="off">
    <label id="lPass"></label><input id="fPass" type="text" autocomplete="new-password"><div class="hint" id="hPass"></div>
  </div>
  <div class="sec" id="lApiSec"></div>
  <label id="lPreset"></label><select id="fPreset"></select>
  <label id="lName"></label><input id="fName" type="text" autocomplete="off">
  <label id="lBase"></label><input id="fBase" type="url" placeholder="https://..." autocomplete="off">
  <label id="lKey"></label><input id="fKey" type="password" autocomplete="new-password">
  <label id="lModel"></label><input id="fModel" type="text" autocomplete="off">
  <div class="hint" id="hApi"></div>
  <div class="newpass" id="newPass" hidden></div>
  <div class="err" id="dlgErr"></div>
  <div class="foot"><button value="cancel" id="dlgCancel" formnovalidate></button><button class="primary" id="dlgOk" value="ok"></button></div>
</form></dialog>
<script>
const en = !/^pt/i.test(navigator.language || '');
const T = en ? {
  pull: 'Fetch new cloud version', pulling: 'Fetching...', pulled: 'New version downloaded: each cloud studio switches when its page is opened.', same: 'Already on the latest version.', title: 'Administration', back: 'Back to the studio', search: 'Search by e-mail', reload: 'Refresh', users: 'accounts', running: 'cloud studios on', pcs: 'PCs online', disk: 'disk in use',
  signupOpen: 'sign-up open', signupClosed: 'sign-up closed', cfg: (s) => `Per studio: ${s.mem} RAM, ${s.cpus} CPU, turns off after ${s.idleMin} min idle, default quota ${s.defaultQuotaMb} MB. Image: ${s.image}`,
  created: 'created', last: 'last sign-in', never: 'never', devices: 'linked PCs', on: 'cloud on', pc: 'PC online', twofa: '2FA', admin: 'admin', disabled: 'blocked',
  disable: 'Block', enable: 'Unblock', stop: 'Turn off cloud', logout: 'End sessions', reset2fa: 'Reset 2FA', setQuota: 'Disk quota', setPassword: 'New password', makeAdmin: 'Make admin', removeAdmin: 'Remove admin', del: 'Delete',
  newClient: 'New client', newTitle: 'New client', email: 'E-mail', pass: 'Password', passHint: 'Leave empty to generate one (shown once at the end).', apiSec: 'Default API (optional)', preset: 'Provider', name: 'Name', base: 'API address (OpenAI-compatible)', key: 'API key', model: 'Model',
  apiHint: 'It becomes the default model of this client\'s cloud studio (right away if it is on, otherwise next time it turns on). The key is not stored by the hub.', create: 'Create', save: 'Save', cancel: 'Cancel', close: 'Close', setApi: 'Default API', apiTitle: 'Default API of {0}', apiTag: 'API', created2: 'Account created.', genPass: 'Password (copy it now, it is not shown again): ', custom: 'Other (enter the address)',
  askQuota: 'Disk quota in MB (0 = server default):', askPass: 'New password for {0} (min. 8 characters). Their sessions are ended:', askDel: 'Delete {0} and ALL their cloud files? Type APAGAR to confirm:', sure: 'Are you sure? ({0})', done: 'Done',
} : {
  pull: 'Buscar versão nova da nuvem', pulling: 'Buscando...', pulled: 'Versão nova baixada: cada studio da nuvem troca quando a página dele for aberta.', same: 'Já está na versão mais nova.', title: 'Administração', back: 'Voltar ao studio', search: 'Buscar por e-mail', reload: 'Atualizar', users: 'contas', running: 'studios ligados na nuvem', pcs: 'PCs online', disk: 'disco em uso',
  signupOpen: 'cadastro aberto', signupClosed: 'cadastro fechado', cfg: (s) => `Cada studio: ${s.mem} de RAM, ${s.cpus} CPU, desliga após ${s.idleMin} min parado, cota padrão de ${s.defaultQuotaMb} MB. Imagem: ${s.image}`,
  created: 'criada', last: 'último login', never: 'nunca', devices: 'PCs vinculados', on: 'nuvem ligada', pc: 'PC online', twofa: 'duas etapas', admin: 'admin', disabled: 'bloqueada',
  disable: 'Bloquear', enable: 'Desbloquear', stop: 'Desligar a nuvem', logout: 'Encerrar sessões', reset2fa: 'Zerar duas etapas', setQuota: 'Cota de disco', setPassword: 'Nova senha', makeAdmin: 'Tornar admin', removeAdmin: 'Tirar admin', del: 'Apagar',
  newClient: 'Novo cliente', newTitle: 'Novo cliente', email: 'E-mail', pass: 'Senha', passHint: 'Deixe vazio para gerar uma (aparece uma vez, no fim).', apiSec: 'API padrão (opcional)', preset: 'Provedor', name: 'Nome', base: 'Endereço da API (compatível com OpenAI)', key: 'Chave da API', model: 'Modelo',
  apiHint: 'Vira o modelo padrão do studio da nuvem desse cliente (na hora, se estiver ligado; senão, quando ligar). A chave não fica guardada na central.', create: 'Criar', save: 'Salvar', cancel: 'Cancelar', close: 'Fechar', setApi: 'API padrão', apiTitle: 'API padrão de {0}', apiTag: 'API', created2: 'Conta criada.', genPass: 'Senha (copie agora, não aparece de novo): ', custom: 'Outro (digite o endereço)',
  askQuota: 'Cota de disco em MB (0 = a padrão do servidor):', askPass: 'Senha nova para {0} (mín. 8 caracteres). As sessões dela são encerradas:', askDel: 'Apagar {0} e TODOS os arquivos dela na nuvem? Digite APAGAR para confirmar:', sure: 'Tem certeza? ({0})', done: 'Feito',
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (t) => t ? new Date(t * 1000).toLocaleString(en ? 'en' : 'pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : T.never;
const fmtMb = (mb) => mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb + ' MB';
$('title').textContent = T.title; $('back').textContent = T.back; $('q').placeholder = T.search; $('reload').textContent = T.reload;
let data = null;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
async function load() {
  $('err').textContent = '';
  try {
    const r = await fetch('/hub/api/admin/users', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    data = j; draw();
  } catch (e) { $('err').textContent = e.message; }
}
async function act(u, action, extra = {}) {
  const r = await fetch('/hub/api/admin/action', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-hub': '1' }, body: JSON.stringify({ id: u.id, action, ...extra }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('err').textContent = j.error || r.statusText; return; }
  toast(T.done); load();
}
function draw() {
  const s = data.stats;
  $('stats').innerHTML = [[s.users, T.users], [`${s.running}/${s.maxRunning}`, T.running], [s.pcs, T.pcs], [fmtMb(s.diskMb), T.disk], [s.signupOpen ? '✓' : '×', s.signupOpen ? T.signupOpen : T.signupClosed]]
    .map(([b, l]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(l)}</span></div>`).join('');
  $('cfg').textContent = T.cfg(s);
  const q = $('q').value.trim().toLowerCase();
  const list = $('list'); list.innerHTML = '';
  for (const u of data.users.filter((u) => !q || u.email.includes(q))) {
    const pct = Math.min(100, Math.round(100 * u.diskMb / Math.max(1, u.quotaMb)));
    const el = document.createElement('div');
    el.className = 'u' + (u.disabled ? ' off' : '');
    el.innerHTML = `<div class="top"><span class="em">${esc(u.email)}</span>
      ${u.admin ? `<span class="tag adm">${T.admin}</span>` : ''}${u.disabled ? `<span class="tag bad">${T.disabled}</span>` : ''}
      ${u.api ? `<span class="tag adm">${T.apiTag}: ${esc(u.api.name || u.api.model)}</span>` : ''}${u.twofa ? `<span class="tag on">${T.twofa}</span>` : ''}${u.running ? `<span class="tag on">${T.on}</span>` : ''}${u.pc ? `<span class="tag on">${T.pc}: ${esc(u.pc)}</span>` : ''}</div>
      <div class="meta"><span>#${u.id}</span><span>${T.created} ${fmtDate(u.created)}</span><span>${T.last} ${fmtDate(u.lastLogin)}</span><span>${T.devices}: ${u.devices}</span><span>${fmtMb(u.diskMb)} / ${fmtMb(u.quotaMb)}</span></div>
      <div class="disk"><i class="${pct >= 100 ? 'full' : ''}" style="width:${pct}%"></i></div>
      <div class="acts"></div>`;
    const acts = el.querySelector('.acts');
    const btn = (label, fn, danger) => { const b = document.createElement('button'); b.textContent = label; if (danger) b.className = 'danger'; b.onclick = fn; acts.append(b); };
    const sure = (label, action) => () => { if (confirm(T.sure.replace('{0}', label))) act(u, action); };
    if (u.running) btn(T.stop, () => act(u, 'stop'));
    btn(T.setApi, () => openDlg(u));
    btn(T.setQuota, () => { const v = prompt(T.askQuota, u.customQuota ? u.quotaMb : 0); if (v != null) act(u, 'setQuota', { quotaMb: parseInt(v, 10) || 0 }); });
    btn(T.setPassword, () => { const v = prompt(T.askPass.replace('{0}', u.email)); if (v) act(u, 'setPassword', { password: v }); });
    if (u.twofa) btn(T.reset2fa, sure(T.reset2fa, 'reset2fa'));
    btn(T.logout, () => act(u, 'logout'));
    if (u.id === data.me) { list.append(el); continue; }
    btn(u.admin ? T.removeAdmin : T.makeAdmin, sure(u.admin ? T.removeAdmin : T.makeAdmin, u.admin ? 'removeAdmin' : 'makeAdmin'));
    btn(u.disabled ? T.enable : T.disable, u.disabled ? () => act(u, 'enable') : sure(T.disable, 'disable'), !u.disabled);
    btn(T.del, () => { const v = prompt(T.askDel.replace('{0}', u.email)); if (v) act(u, 'delete', { confirm: v }); }, true);
    list.append(el);
  }
}
// ---------------- novo cliente / API padrão
const PRESETS = [
  ['OpenAI', 'https://api.openai.com/v1', 'gpt-4.1-mini'],
  ['Google Gemini', 'https://generativelanguage.googleapis.com/v1beta/openai', 'gemini-2.5-flash'],
  ['Groq', 'https://api.groq.com/openai/v1', 'llama-3.3-70b-versatile'],
  ['OpenRouter', 'https://openrouter.ai/api/v1', 'openai/gpt-4.1-mini'],
  ['NVIDIA NIM', 'https://integrate.api.nvidia.com/v1', 'meta/llama-3.3-70b-instruct'],
  ['DeepSeek', 'https://api.deepseek.com/v1', 'deepseek-chat'],
];
for (const [k, v] of Object.entries({ lEmail: T.email, lPass: T.pass, hPass: T.passHint, lApiSec: T.apiSec, lPreset: T.preset, lName: T.name, lBase: T.base, lKey: T.key, lModel: T.model, hApi: T.apiHint, dlgCancel: T.cancel })) $(k).textContent = v;
$('fPreset').innerHTML = PRESETS.map(([n], i) => `<option value="${i}">${esc(n)}</option>`).join('') + `<option value="">${esc(T.custom)}</option>`;
$('fPreset').onchange = () => { const p = PRESETS[$('fPreset').value]; if (p) { $('fName').value = p[0]; $('fBase').value = p[1]; $('fModel').value = p[2]; } else { $('fBase').value = ''; $('fBase').focus(); } };
let dlgUser = null, dlgDone = false;
function openDlg(u) {
  dlgUser = u; dlgDone = false;
  $('dlgAcct').hidden = !!u;
  $('dlgTitle').textContent = u ? T.apiTitle.replace('{0}', u.email) : T.newTitle;
  $('dlgOk').textContent = u ? T.save : T.create; $('dlgOk').hidden = false; $('dlgCancel').textContent = T.cancel;
  for (const id of ['fEmail', 'fPass', 'fKey']) $(id).value = '';
  $('fPreset').value = '0'; $('fPreset').onchange();
  if (u?.api) { $('fPreset').value = ''; $('fName').value = u.api.name || ''; $('fBase').value = u.api.base || ''; $('fModel').value = u.api.model || ''; }
  $('lApiSec').textContent = u ? T.apiSec.replace(/ \(.*\)$/, '') : T.apiSec;
  $('newPass').hidden = true; $('dlgErr').textContent = '';
  $('dlg').showModal();
}
$('dlgOk').onclick = async (e) => {
  e.preventDefault();
  if (dlgDone) { $('dlg').close(); return; }
  $('dlgErr').textContent = '';
  const api = { name: $('fName').value.trim(), base: $('fBase').value.trim(), key: $('fKey').value.trim(), model: $('fModel').value.trim() };
  const withApi = !!(api.base || api.key);
  const body = dlgUser ? { id: dlgUser.id, action: 'setApi', ...api } : { action: 'create', email: $('fEmail').value.trim(), password: $('fPass').value, ...(withApi ? { api } : {}) };
  const r = await fetch('/hub/api/admin/action', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-hub': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('dlgErr').textContent = j.error || r.statusText; return; }
  if (j.apiError) $('dlgErr').textContent = j.apiError;
  load();
  if (j.password) {
    $('newPass').hidden = false; $('newPass').textContent = T.genPass + j.password;
    dlgDone = true; $('dlgOk').textContent = T.close; $('dlgCancel').hidden = true;
    return;
  }
  toast(dlgUser ? T.done : T.created2);
  $('dlg').close();
};
$('dlg').addEventListener('close', () => { $('dlgCancel').hidden = false; });
$('new').textContent = T.newClient;
$('new').onclick = () => openDlg(null);
$('q').oninput = () => data && draw();
$('reload').onclick = load;
$('pull').textContent = T.pull;
$('pull').onclick = async () => {
  const b = $('pull'); b.disabled = true; b.textContent = T.pulling; $('err').textContent = '';
  try {
    const r = await fetch('/hub/api/admin/pull', { method: 'POST', headers: { 'x-hub': '1' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    toast(j.changed ? T.pulled : T.same);
  } catch (e) { $('err').textContent = e.message; }
  b.disabled = false; b.textContent = T.pull;
};
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>

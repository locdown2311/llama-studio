name: Nuvem

# Imagens da versão nuvem (studio-hub e o studio de cada usuário) para ARM64 e x86_64, no GitHub Container
# Registry. Cada arquitetura compila nativa no próprio runner (sem emulação) e no fim vira uma tag só.
on:
  push:
    branches: [main]
    paths: ['src/**', 'ui/**', 'hub/**', 'cloud/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/cloud.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Testes da central
        working-directory: hub
        run: cargo test --release --locked
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Endereço do Ghidra
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a API do GitHub sem token tem limite por IP (os runners dividem): resolve aqui, autenticado
          echo "url=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest -q '[.assets[] | select(.name | endswith(".zip")) | .browser_download_url][0]')" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      # o cache mantém iguais as camadas que não mudaram (Ghidra, Java, Chromium...): a atualização no servidor
      # baixa só o que mudou (o executável do studio, alguns MB) em vez da imagem inteira
      - name: Studio da nuvem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile.studio
          build-args: GHIDRA_URL=${{ steps.gh.outputs.url }}
          tags: ghcr.io/${{ steps.gh.outputs.owner }}/llama-studio-cloud:${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=studio-${{ matrix.arch }}
          cache-to: type=gha,scope=studio-${{ matrix.arch }},mode=max
      - name: Teste da imagem (Ghidra, Chromium, studio)
        run: |
          img=ghcr.io/${{ steps.gh.outputs.owner }}/llama-studio-cloud:${{ matrix.arch }}
          docker image ls "$img"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$img" | cut -c1-150 | head -12
          docker run --rm --entrypoint sh "$img" -c 'set -e; studio-browser --version || ls -la /usr/local/bin/studio-browser; node --version; npx --version; cp /bin/ls /tmp/ls; GHIDRA_MAXMEM=1500M ghidra-decompile --list /tmp/ls > /tmp/out; head -5 /tmp/out; grep -q "# funções" /tmp/out; GHIDRA_MAXMEM=1500M ghidra-decompile /tmp/ls main | head -15'
      - name: Central
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile.hub
          tags: ghcr.io/${{ steps.gh.outputs.owner }}/studio-hub:${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=hub-${{ matrix.arch }}
          cache-to: type=gha,scope=hub-${{ matrix.arch }},mode=max
      - name: Enviar
        run: docker push ghcr.io/${{ steps.gh.outputs.owner }}/llama-studio-cloud:${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Uma tag para as duas arquiteturas
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          for img in llama-studio-cloud studio-hub; do
            for tag in latest $v; do
              docker buildx imagetools create -t ghcr.io/$owner/$img:$tag ghcr.io/$owner/$img:arm64 ghcr.io/$owner/$img:amd64
            done
          done

name: CI

# Confere pull requests; pushes no main já são compilados pelo Release.
on:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: Get-ChildItem ui/js/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - run: node tests/rotas/run.mjs
      - working-directory: tests/ordem
        run: |
          npm ci --no-audit --no-fund
          node run.cjs
      - run: cargo check --locked

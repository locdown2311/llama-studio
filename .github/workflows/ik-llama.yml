name: ik_llama.cpp (Windows)

# Compila o ik_llama.cpp (fork do llama.cpp, mais rápido com MoE na CPU) para Windows,
# porque ele não publica binários. Sai como pré-release "ik-AAAAMMDD-<commit>" neste
# repositório; o Llama Studio lista essas builds em Servidor > Motor.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou branch do ik_llama.cpp
        default: main
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: ['.github/workflows/ik-llama.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.s.outputs.sha }}
      tag: ${{ steps.s.outputs.tag }}
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.event.inputs.ref || 'main' }}"
          sha=$(git ls-remote https://github.com/ikawrakow/ik_llama.cpp "$ref" | head -1 | cut -f1)
          [ -z "$sha" ] && sha="$ref"
          tag="ik-$(date -u +%Y%m%d)-${sha:0:7}"
          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          # pula só se essa build já saiu completa (cpu e vulkan)
          n=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length' 2>/dev/null || echo 0)
          if [ "$n" -ge 2 ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi
          echo "ik_llama.cpp $sha -> $tag"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            cmake: -DGGML_NATIVE=OFF -DGGML_AVX2=ON
          - name: vulkan
            cmake: -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_VULKAN=ON
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ikawrakow/ik_llama.cpp
          ref: ${{ needs.prepare.outputs.sha }}
          path: ik

      - name: Vulkan SDK
        if: matrix.name == 'vulkan'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.309.0
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\vk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          & "$env:RUNNER_TEMP\vk.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar
        shell: pwsh
        working-directory: ik
        run: |
          # Ninja + MSVC do ambiente
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=ON ${{ matrix.cmake }}
          if ($LASTEXITCODE -ne 0) { throw "configuração falhou" }
          cmake --build build -j 4 --target llama-server llama-bench
          if ($LASTEXITCODE -ne 0) { throw "falhou" }

      - name: Empacotar
        shell: pwsh
        run: |
          $out = "ik_llama-${{ needs.prepare.outputs.tag }}-bin-win-${{ matrix.name }}-x64"
          New-Item -ItemType Directory $out | Out-Null
          Get-ChildItem ik/build/bin -Include *.exe,*.dll -Recurse | Copy-Item -Destination $out
          if (-not (Test-Path "$out/llama-server.exe")) { throw "sem llama-server.exe" }
          Copy-Item ik/LICENSE "$out/LICENSE-ik_llama.txt" -ErrorAction SilentlyContinue
          7z a -tzip "$out.zip" "./$out/*" | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ik_llama-*.zip

  release:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Conferir
        run: ls -la dist; test -n "$(ls dist/*.zip 2>/dev/null)"
      - name: Publicar (pré-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -x
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Builds do [ik_llama.cpp](https://github.com/ikawrakow/ik_llama.cpp) para Windows x64, commit `%s`.\n\nInstale pelo Llama Studio em **Servidor → Motor**. Licença MIT (a do ik_llama.cpp vai dentro de cada pacote).\n' "$SHA" > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" --title "ik_llama.cpp $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber

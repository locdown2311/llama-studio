[package]
name = "llama-studio"
version = "2.47.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Interface local para o llama-server com pasta de trabalho, habilidades e conectores MCP"

[features]
default = ["desktop"]
desktop = ["dep:wry", "dep:tao", "dep:tray-icon"]

[dependencies]
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt", "macros", "net", "process", "io-util", "fs", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8.13"
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
walkdir = "2.5"
regex-lite = "0.1"
which = "8"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
jpeg-encoder = "0.7"
base64 = "0.22"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
tray-icon = { version = "0.26", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
